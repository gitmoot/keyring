name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: format, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: go test -race ./... -count=1
      - name: Build isolated smoke-test CLI
        if: github.event_name == 'pull_request'
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/keyring" ./cmd/keyring
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: keyring-smoke-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/keyring
          retention-days: 1
          overwrite: true
  macos-import:
    name: native macOS private-pipe import
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./cmd/keyring -run '^Test(SetDarwinPipeImportBoundary|CloudflareClientImport)$' -count=1 -v
